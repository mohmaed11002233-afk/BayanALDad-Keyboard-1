name: Simple Android Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate App Files
        run: |
          mkdir -p app/src/main/java/com/bayan/dad
          mkdir -p app/src/main/res/layout

          echo "include ':app'" > settings.gradle

          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.0' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle

          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { namespace 'com.bayan.dad'; compileSdk 34; defaultConfig { applicationId 'com.bayan.dad'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' } }" >> app/build.gradle

          echo '<manifest package="com.bayan.dad"><application android:label="بيان الضاد"></application></manifest>' > app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          gradle wrapper
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BayanAlDad-APK
          path: app/build/outputs/apk/debug/app-debug.apk
