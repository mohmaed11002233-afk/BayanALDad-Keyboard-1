name: Build Android App

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
        run: |
          mkdir -p app/src/main/java/com/bayandalad/keyboard
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.bayandalad.keyboard'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.bayandalad.keyboard'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.bayandalad.keyboard">
              <application
                  android:allowBackup="true"
                  android:label="بيان الضاد"
                  android:supportsRtl="true">
                  <service
                      android:name=".BayanKeyboardService"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/method.xml
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity=""
              android:supportsSwitchToNextInputMethod="true" />
          EOF

          cat << 'EOF' > app/src/main/res/layout/bayan_keyboard_layout.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:background="#ECEFF1"
              android:padding="8dp">
              <Button
                  android:id="@+id/magicCorrectionBtn"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  text="✨ بيان الضاد"
                  android:backgroundTint="#2196F3"
                  android:textColor="#FFFFFF"
                  android:padding="10dp"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/bayandalad/keyboard/BayanKeyboardService.kt
          package com.bayandalad.keyboard
          import android.inputmethodservice.InputMethodService
          import android.view.View
          import android.widget.Button

          class BayanKeyboardService : InputMethodService() {
              override fun onCreateInputView(): View {
                  val view = layoutInflater.inflate(R.layout.bayan_keyboard_layout, null)
                  val btn = view.findViewById<Button>(R.id.magicCorrectionBtn)
                  btn.setOnClickListener {
                      val ic = currentInputConnection
                      ic?.commitText("✨ بيان الضاد", 1)
                  }
                  return view
              }
          }
          EOF

          gradle wrapper
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BayanAlDad-APK
          path: app/build/outputs/apk/debug/app-debug.apk
